name: Capture Lucky after motion refinement
on:
  push:
    branches: [lucky-layered-motion-work]
    paths: [.github/workflows/capture-lucky-after.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Run browser checks and save the refined page
        run: |
          python3 -m http.server 4173 >/tmp/lucky-http.log 2>&1 &
          mkdir -p qa
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi; sleep 0.2; done
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const sprites = ['idle', 'blink', 'hello', 'play', 'sleep'].map(name => 'assets/lucky-cozy-' + name + '.png');
          for (const target of [
            { name: 'desktop', viewport: { width: 1440, height: 900 }, hasTouch: false },
            { name: 'mobile', viewport: { width: 390, height: 844 }, hasTouch: true }
          ]) {
            const context = await browser.newContext({ viewport: target.viewport, deviceScaleFactor: 1, hasTouch: target.hasTouch });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('response', r => { if (r.url().startsWith('http://127.0.0.1:4173/') && r.status() >= 400) errors.push(r.status() + ' ' + r.url()); });
            await page.goto('http://127.0.0.1:4173/index.html#/character', { waitUntil: 'networkidle' });
            await page.locator('.lucky-pet-rig').waitFor();
            await page.waitForTimeout(1800);
            const dimensions = await page.evaluate(async sprites => {
              return await Promise.all(sprites.map(src => new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve([src, image.naturalWidth, image.naturalHeight]);
                image.onerror = () => reject(new Error('Missing sprite: ' + src));
                image.src = src;
              })));
            }, sprites);
            if (dimensions.some(([, w, h]) => w !== 1329 || h !== 1183)) throw new Error('Sprite dimensions disagree: ' + JSON.stringify(dimensions));
            const rig = page.locator('.lucky-pet-rig');
            if (!(await rig.isVisible())) throw new Error('Pet rig hidden on ' + target.name);
            if (errors.length) throw new Error(target.name + ': ' + errors.join('; '));
            await page.screenshot({ path: 'qa/after-' + target.name + '-viewport.png' });
            if (target.name === 'mobile') await page.screenshot({ path: 'qa/after-mobile.png', fullPage: true });
            await page.locator('.lucky-pet-character').click();
            if (await page.locator('.lucky-pet').getAttribute('data-state') !== 'hello') throw new Error('Pet touch action failed');
            await page.locator('.lucky-pet-menu-toggle').click();
            await page.locator('[data-pet-action="sleep"]').click();
            if (await page.locator('.lucky-pet').getAttribute('data-state') !== 'sleep') throw new Error('Pet sleep action failed');
            await page.locator('.lucky-pet-menu-toggle').click();
            await page.locator('[data-pet-action="sleep"]').click();
            if (await page.locator('.lucky-pet').getAttribute('data-state') === 'sleep') throw new Error('Pet wake action failed');
            if (errors.length) throw new Error(target.name + ': ' + errors.join('; '));
            console.log(target.name + ' passed; sprites=' + JSON.stringify(dimensions));
            await context.close();
          }
          const closeContext = await browser.newContext({ viewport: { width: 900, height: 600 }, deviceScaleFactor: 4 });
          const closePage = await closeContext.newPage();
          await closePage.goto('http://127.0.0.1:4173/index.html#/character', { waitUntil: 'networkidle' });
          await closePage.locator('.lucky-pet-rig').waitFor();
          await closePage.waitForTimeout(1500);
          const petBox = await closePage.locator('.lucky-pet').boundingBox();
          const clip = { x: 0, y: Math.max(0, petBox.y - 8), width: 236, height: 220 };
          await closePage.screenshot({ path: 'qa/after-pet-idle-closeup.png', clip, scale: 'device' });
          await closePage.locator('.lucky-pet').evaluate(el => el.classList.add('is-blinking'));
          await closePage.waitForTimeout(100);
          const blinkOpacity = await closePage.locator('.lucky-pet-blink').first().evaluate(el => Number(getComputedStyle(el).opacity));
          if (blinkOpacity < .99) throw new Error('Eye blink layer did not become visible');
          await closePage.screenshot({ path: 'qa/after-pet-blink-closeup.png', clip, scale: 'device' });
          await closePage.locator('.lucky-pet').evaluate(el => el.classList.remove('is-blinking'));
          await closePage.locator('.lucky-pet-character').click();
          await closePage.screenshot({ path: 'qa/after-pet-paw-closeup.png', clip, scale: 'device' });
          await closePage.locator('.lucky-pet-menu-toggle').click();
          await closePage.locator('[data-pet-action="sleep"]').click();
          await closePage.waitForTimeout(380);
          await closePage.screenshot({ path: 'qa/after-pet-sleep-closeup.png', clip, scale: 'device' });
          await closeContext.close();
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: lucky-after-motion
          path: qa/after-*.png
      - name: Preserve after screenshots on the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/after-*.png
          git commit -m "Save after screenshots for Lucky motion comparison"
          git pull --rebase origin lucky-layered-motion-work
          git push
